name: pdf-studio
services:
  web:
    build:
      context: .
      target: production
      args:
        SITE_URL: ${SITE_URL:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pdfstudio
      POSTGRES_USER: pdfstudio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdfstudio -d pdfstudio"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: base
    environment:
      DOCUMENT_STORAGE_DIR: /data/documents
      DATABASE_URL: postgresql://pdfstudio:${POSTGRES_PASSWORD:-local-development-only}@db:5432/pdfstudio
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ROOT_ADMIN_EMAIL: ${ROOT_ADMIN_EMAIL:-root@pdfstudio.local}
      ROOT_ADMIN_PASSWORD: ${ROOT_ADMIN_PASSWORD:-Pdfs!9vQ2#mL7xR4@kT6z}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - documents:/data/documents
    mem_limit: 512m
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker
    environment:
      DOCUMENT_STORAGE_DIR: /data/documents
      DATABASE_URL: postgresql://pdfstudio:${POSTGRES_PASSWORD:-local-development-only}@db:5432/pdfstudio
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - documents:/data/documents
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
  dev:
    profiles: [dev]
    build:
      context: .
      target: development
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./app:/app
      - dev_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev"
volumes:
  dev_modules:
  database:
  documents:



