name: Verify and build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-studio-dist
          path: app/dist
      - name: Build and smoke-test production container
        working-directory: .
        run: |
          docker compose up --build --detach web
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8080/healthz; then break; fi
            sleep 2
          done
          curl --fail http://localhost:8080/healthz
          curl --fail http://localhost:8080/ | grep -q 'PDF Park'
      - name: Stop containers
        if: always()
        working-directory: .
        run: docker compose down
