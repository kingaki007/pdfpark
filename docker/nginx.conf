map $uri $search_robots {
  default "";
  ~^/admin(?:/|$) "noindex, nofollow";
  ~^/api/ "noindex, nofollow";
}
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Robots-Tag $search_robots always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
  client_max_body_size 40m;
  location = /robots.txt { try_files $uri =404; }
  location = /sitemap.xml { try_files $uri =404; }
  location /api/ {

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }
  # PDF.js ships its module worker as .mjs; older Nginx MIME maps omit it.
  location ~* \.mjs$ {
    types { application/javascript mjs; }
    try_files $uri =404;
    expires 1y;
  }
  location /assets/ { try_files $uri =404; expires 1y; }
  location /pdf-assets/ { try_files $uri =404; expires 1d; }
  location / { try_files $uri $uri/ /index.html; }
}




